<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<!-- Carousel panel skeleton. Copy per panel into work/<date>/build/. -->
<link rel="stylesheet" href="../../system/carousel.css">
<style>
  /* panel-specific positioning goes here (absolute visual elements, connectors) */
</style></head>
<body>
<div class="panel" data-layer="Panel N">

  <!-- COVER: <div class="eyebrow">Product name</div> + <div class="title title--big">…</div>
       STEP: <div class="eyebrow"><span class="num">1</span> Phase</div> + <div class="title">…</div> -->
  <div class="eyebrow"><span class="num">1</span> Phase</div>
  <div class="title">Panel headline</div>
  <div class="sub">One supporting line.</div>

  <!-- visual area: real exported components only (tables, diagrams, logos, connectors) -->

  <!-- footer (every panel) -->
  <div class="dots"><span class="on"></span><span></span><span></span><span></span></div>
  <div class="wm"><img src="../../system/wordmark.svg" alt="wordmark"></div>
</div>
</body></html>
